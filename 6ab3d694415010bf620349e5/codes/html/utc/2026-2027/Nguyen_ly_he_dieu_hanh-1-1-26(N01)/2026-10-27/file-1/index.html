<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bảng 2026-10-27 – có thể chỉnh sửa</title>
<style>
:root{--bg:#f4f4f2;--fg:#1f1f1d;--mut:#6b6b66;--card:#fff;--line:#d9d9d4;--acc:#1a5fb4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--fg:#ececea;--mut:#9a9a94;--line:#3a3a37;--acc:#7ab0ff}}
:root[data-theme="dark"]{--bg:#161615;--fg:#ececea;--mut:#9a9a94;--line:#3a3a37;--acc:#7ab0ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:16px 16px 8px}h1{font-size:18px;margin:0 0 4px}.sub{color:var(--mut);font-size:13px}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 16px 10px}
.tools .sep{width:1px;height:24px;background:var(--line);margin:0 4px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:#1f1f1d;border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--acc)}
.sw{width:28px;height:28px;padding:0;border-radius:50%}
.wrap{margin:0 16px 24px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff;max-height:70vh}
table{border-collapse:collapse;table-layout:fixed;color:#000;font:15px Calibri,"Segoe UI",Arial,sans-serif}
th{background:#f0f0ee;color:#555;font:12px system-ui,sans-serif;font-weight:500;border:1px solid #ccc;position:sticky;top:0;z-index:1;user-select:none;cursor:pointer;min-width:28px}
th[data-rh]{position:sticky;left:0;top:auto;z-index:1}
th.corner{left:0;z-index:2}
td{border:1px solid #bbb;height:26px;width:56px;min-width:56px;text-align:center;padding:0 4px;white-space:nowrap;overflow:hidden;cursor:cell;user-select:none}
td.lbl{width:90px;min-width:90px;text-align:left}
td.sel{outline:2px solid var(--acc);outline-offset:-2px;box-shadow:inset 0 0 0 100px rgba(26,95,180,.12)}
td.edit{user-select:text;cursor:text;outline:2px solid #e8590c;background:#fff!important;box-shadow:none;text-overflow:clip}
#status{color:var(--mut);font-size:12px;padding:0 16px 8px}
@page{size:A4 landscape;margin:8mm}
@media print{
 html,body{background:#fff!important}
 header,.tools,#status{display:none!important}
 .wrap{border:none;margin:0;overflow:visible;max-height:none}
 th{display:none}
 td.sel{outline:none;box-shadow:none}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style></head><body>
<header><h1>Bảng 2026-10-27 <span class="sub">· Sheet1 (chỉnh sửa được)</span></h1>
<div class="sub">Bấm ô để chọn, kéo chuột để chọn vùng. Gõ trực tiếp để nhập số liệu (Enter/Tab để sang ô kế, Delete để xoá). Dữ liệu tự lưu trên trình duyệt này.</div></header>
<div class="tools">
 <button data-act="addRow">+ Dòng</button><button data-act="delRow">− Dòng</button>
 <button data-act="addCol">+ Cột</button><button data-act="delCol">− Cột</button>
 <span class="sep"></span>
 <button data-act="tick" title="Điền hoặc bỏ dấu x ở ô đang chọn">✓ Tích (x)</button>
 <button data-act="clear">Xoá nội dung</button>
 <span class="sep"></span>
 <button class="sw" data-color="blue" style="background:#b4c7e7" title="Xanh dương"></button>
 <button class="sw" data-color="green" style="background:#e2efda" title="Xanh lá"></button>
 <button class="sw" data-color="yellow" style="background:#fff2cc" title="Vàng"></button>
 <button class="sw" data-color="red" style="background:#f8cbad" title="Đỏ cam"></button>
 <button class="sw" data-color="gray" style="background:#d9d9d9" title="Xám"></button>
 <button class="sw" data-color="" title="Bỏ màu">∅</button>
 <span class="sep"></span>
 <button id="printBtn">🖨️ In ngang</button>
 <button id="resetBtn">Khôi phục bản gốc</button>
</div>
<div id="status"></div>
<div class="wrap"><table id="grid"></table></div>

<script>
// ===================== DỮ LIỆU GỐC (đọc từ Sheet1) =====================
// Mỗi dòng là một mảng các ô, từ cột A đến cột N. "" = ô trống.
// Dòng 1 (số thứ tự trang), rồi các khối FIFO / OPT / LRU, mỗi khối có Frame 1-3,
// dòng dấu x (lỗi trang) và ô "Tổng:".
const ORIGINAL = {
  rows: [
  ["", "7", "0", "1", "2", "0", "3", "0", "4", "2", "3", "0", "3", "2"],
  ["FIFO", "7", "0", "1", "2", "0", "3", "0", "4", "2", "3", "0", "3", "2"],
  ["Frame 1", "7", "7", "7", "2", "2", "2", "2", "4", "4", "4", "0", "0", "0"],
  ["Frame 2", "", "0", "0", "0", "0", "3", "3", "3", "2", "2", "2", "2", "2"],
  ["Frame 3", "", "", "1", "1", "1", "1", "0", "0", "0", "3", "3", "3", "3"],
  ["", "x", "x", "x", "x", "", "x", "x", "x", "x", "x", "x", "", ""],
  ["", "", "", "", "", "", "", "", "", "", "", "", "Tổng:", "10"],
  ["", "", "", "", "", "", "", "", "", "", "", "", "", ""],
  ["", "", "", "", "", "", "", "", "", "", "", "", "", ""],
  ["OPT", "7", "0", "1", "2", "0", "3", "0", "4", "2", "3", "0", "3", "2"],
  ["Frame 1", "7", "7", "7", "2", "2", "2", "2", "2", "2", "2", "2", "2", "2"],
  ["Frame 2", "", "0", "0", "0", "0", "0", "0", "4", "4", "4", "0", "0", "0"],
  ["Frame 3", "", "", "1", "1", "1", "3", "3", "3", "3", "3", "3", "3", "3"],
  ["", "x", "x", "x", "x", "", "x", "", "x", "", "", "x", "", ""],
  ["", "", "", "", "", "", "", "", "", "", "", "", "Tổng:", "7"],
  ["", "", "", "", "", "", "", "", "", "", "", "", "", ""],
  ["", "", "", "", "", "", "", "", "", "", "", "", "", ""],
  ["OPT", "7", "0", "1", "2", "0", "3", "0", "4", "2", "3", "0", "3", "2"],
  ["Frame 1", "7", "7", "7", "2", "2", "2", "2", "4", "4", "4", "0", "0", "0"],
  ["Frame 2", "", "0", "0", "0", "0", "0", "0", "0", "0", "3", "3", "3", "3"],
  ["Frame 3", "", "", "1", "1", "1", "3", "3", "3", "2", "2", "2", "2", "2"],
  ["", "x", "x", "x", "x", "", "x", "", "x", "x", "x", "x", "", ""],
  ["", "", "", "", "", "", "", "", "", "", "", "", "Tổng:", "9"]
  ],
  // Ô được tô màu: "dòng,cột" (đếm từ 0) -> tên màu (blue, green...)
  colors: {
  "1,1": "blue",
  "1,2": "blue",
  "1,3": "blue",
  "1,4": "blue",
  "1,5": "blue",
  "1,6": "blue",
  "1,7": "blue",
  "1,8": "blue",
  "1,9": "blue",
  "1,10": "blue",
  "1,11": "blue",
  "1,12": "blue",
  "1,13": "blue",
  "2,4": "green",
  "2,8": "green",
  "2,11": "green",
  "3,6": "green",
  "3,9": "green",
  "4,7": "green",
  "4,10": "green",
  "9,1": "blue",
  "9,2": "blue",
  "9,3": "blue",
  "9,4": "blue",
  "9,5": "blue",
  "9,6": "blue",
  "9,7": "blue",
  "9,8": "blue",
  "9,9": "blue",
  "9,10": "blue",
  "9,11": "blue",
  "9,12": "blue",
  "9,13": "blue",
  "10,4": "green",
  "11,8": "green",
  "11,11": "green",
  "12,6": "green",
  "17,1": "blue",
  "17,2": "blue",
  "17,3": "blue",
  "17,4": "blue",
  "17,5": "blue",
  "17,6": "blue",
  "17,7": "blue",
  "17,8": "blue",
  "17,9": "blue",
  "17,10": "blue",
  "17,11": "blue",
  "17,12": "blue",
  "17,13": "blue",
  "18,4": "green",
  "18,8": "green",
  "18,11": "green",
  "19,10": "green",
  "20,6": "green",
  "20,9": "green"
  }
};

// ===================== CHƯƠNG TRÌNH =====================
const COLORS = {blue:'#b4c7e7', green:'#e2efda', yellow:'#fff2cc', red:'#f8cbad', gray:'#d9d9d9'};
const KEY = 'bang-2026-10-27-v1';
const $ = s => document.querySelector(s);
const grid = $('#grid');
let rows, bg;                       // rows: chữ trong ô, bg: màu từng ô
let sel = {r1:0,c1:0,r2:0,c2:0}, anchor = {r:0,c:0}, editing = null, dragging = false;

function fromOriginal(){
  rows = ORIGINAL.rows.map(r => r.map(String));
  bg = rows.map(r => r.map(() => ''));
  for (const k in ORIGINAL.colors){ const [r,c] = k.split(',').map(Number); bg[r][c] = ORIGINAL.colors[k]; }
}
function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.rows && s.bg){ rows = s.rows; bg = s.bg; return; } } catch(e){}
  fromOriginal();
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify({rows, bg})); } catch(e){} }
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function colName(i){ let s=''; i++; while(i>0){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26);} return s; }
const cellEl = (r,c) => grid.querySelector(`td[data-r="${r}"][data-c="${c}"]`);

function render(){
  let h = '<tr><th class="corner"></th>';
  for (let c=0;c<rows[0].length;c++) h += `<th data-ch="${c}">${colName(c)}</th>`;
  h += '</tr>';
  rows.forEach((row,r) => {
    h += `<tr><th data-rh="${r}">${r+1}</th>`;
    row.forEach((v,c) => {
      const st = bg[r][c] ? ` style="background:${COLORS[bg[r][c]]}"` : '';
      h += `<td data-r="${r}" data-c="${c}"${c==0?' class="lbl"':''}${st}>${esc(v)}</td>`;
    });
    h += '</tr>';
  });
  grid.innerHTML = h; paintSel();
}
function norm(){ return {r1:Math.min(sel.r1,sel.r2), r2:Math.max(sel.r1,sel.r2), c1:Math.min(sel.c1,sel.c2), c2:Math.max(sel.c1,sel.c2)}; }
function paintSel(){
  grid.querySelectorAll('td.sel').forEach(t => t.classList.remove('sel'));
  const n = norm();
  for (let r=n.r1;r<=n.r2;r++) for (let c=n.c1;c<=n.c2;c++){ const t = cellEl(r,c); if (t) t.classList.add('sel'); }
  const a = colName(n.c1)+(n.r1+1), b = colName(n.c2)+(n.r2+1);
  $('#status').textContent = `Đang chọn: ${a===b?a:a+':'+b}  ·  ${rows.length} dòng × ${rows[0].length} cột`;
}
function setSel(r1,c1,r2,c2){ sel = {r1,c1,r2,c2}; paintSel(); }

// ---------- nhập liệu ----------
function startEdit(r,c,initial){
  commitEdit(); setSel(r,c,r,c); anchor = {r,c};
  const td = cellEl(r,c); editing = {r,c};
  td.contentEditable = 'plaintext-only'; if (td.contentEditable !== 'plaintext-only') td.contentEditable = 'true';
  td.classList.add('edit'); if (initial !== undefined) td.textContent = initial;
  td.focus(); const g = getSelection(), rg = document.createRange(); rg.selectNodeContents(td); rg.collapse(false); g.removeAllRanges(); g.addRange(rg);
}
function commitEdit(){
  if (!editing) return;
  const {r,c} = editing, td = cellEl(r,c); editing = null;
  if (!td) return;
  rows[r][c] = td.textContent.replace(/\n/g,'').trim();
  td.contentEditable = 'false'; td.classList.remove('edit'); td.textContent = rows[r][c]; save();
}
function cancelEdit(){ if (!editing) return; const {r,c} = editing, td = cellEl(r,c); editing = null; td.contentEditable='false'; td.classList.remove('edit'); td.textContent = rows[r][c]; }
function move(dr,dc){
  const r = Math.max(0,Math.min(rows.length-1, sel.r2+dr)), c = Math.max(0,Math.min(rows[0].length-1, sel.c2+dc));
  setSel(r,c,r,c); anchor = {r,c}; const t = cellEl(r,c); if (t) t.scrollIntoView({block:'nearest',inline:'nearest'});
}

// ---------- chọn ô bằng chuột ----------
grid.addEventListener('mousedown', e => {
  const td = e.target.closest('td'), th = e.target.closest('th');
  if (td && editing && td.classList.contains('edit')) return;
  commitEdit();
  if (td){ const r=+td.dataset.r, c=+td.dataset.c;
    if (e.shiftKey) setSel(anchor.r,anchor.c,r,c); else { anchor={r,c}; setSel(r,c,r,c); }
    dragging = true; e.preventDefault();
  } else if (th && th.dataset.rh !== undefined){ const r=+th.dataset.rh; setSel(r,0,r,rows[0].length-1); anchor={r,c:0}; }
  else if (th && th.dataset.ch !== undefined){ const c=+th.dataset.ch; setSel(0,c,rows.length-1,c); anchor={r:0,c}; }
});
grid.addEventListener('mouseover', e => { const td = e.target.closest('td'); if (dragging && td) setSel(anchor.r,anchor.c,+td.dataset.r,+td.dataset.c); });
window.addEventListener('mouseup', () => dragging = false);
grid.addEventListener('dblclick', e => { const td = e.target.closest('td'); if (td) startEdit(+td.dataset.r,+td.dataset.c); });

// ---------- bàn phím ----------
document.addEventListener('keydown', e => {
  if (!(e.target === document.body || e.target.closest('#grid'))) return;
  if (editing){
    if (e.key==='Enter'){ e.preventDefault(); commitEdit(); move(1,0); }
    else if (e.key==='Tab'){ e.preventDefault(); commitEdit(); move(0,e.shiftKey?-1:1); }
    else if (e.key==='Escape'){ cancelEdit(); }
    return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (k==='ArrowDown'){e.preventDefault();move(1,0);} else if (k==='ArrowUp'){e.preventDefault();move(-1,0);}
  else if (k==='ArrowLeft'){e.preventDefault();move(0,-1);} else if (k==='ArrowRight'||k==='Tab'){e.preventDefault();move(0,e.shiftKey?-1:1);}
  else if (k==='Delete'||k==='Backspace'){ e.preventDefault(); act.clear(); }
  else if (k==='Enter'||k==='F2'){ e.preventDefault(); startEdit(sel.r2,sel.c2); }
  else if (k.length===1){ e.preventDefault(); startEdit(sel.r2,sel.c2,k); }
});

// ---------- các nút chức năng ----------
function each(fn){ const n = norm(); for (let r=n.r1;r<=n.r2;r++) for (let c=n.c1;c<=n.c2;c++) fn(r,c); }
const act = {
  addRow(){ const r = norm().r2+1; rows.splice(r,0,rows[0].map(()=> '')); bg.splice(r,0,rows[0].map(()=> '')); render(); setSel(r,0,r,0); },
  delRow(){ const n = norm(); if (rows.length-(n.r2-n.r1+1) < 1) return; rows.splice(n.r1,n.r2-n.r1+1); bg.splice(n.r1,n.r2-n.r1+1); const r=Math.min(n.r1,rows.length-1); render(); setSel(r,n.c1,r,n.c1); },
  addCol(){ const c = norm().c2+1; rows.forEach(r => r.splice(c,0,'')); bg.forEach(r => r.splice(c,0,'')); render(); setSel(0,c,0,c); },
  delCol(){ const n = norm(), k = n.c2-n.c1+1; if (rows[0].length-k < 1) return; rows.forEach(r => r.splice(n.c1,k)); bg.forEach(r => r.splice(n.c1,k)); const c=Math.min(n.c1,rows[0].length-1); render(); setSel(n.r1,c,n.r1,c); },
  tick(){ let all = true; each((r,c) => { if (rows[r][c] !== 'x') all = false; }); each((r,c) => { rows[r][c] = all ? '' : 'x'; }); render(); },
  clear(){ each((r,c) => { rows[r][c] = ''; }); render(); }
};
document.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => { commitEdit(); act[b.dataset.act](); save(); }));
document.querySelectorAll('[data-color]').forEach(b => b.addEventListener('click', () => { commitEdit(); each((r,c) => { bg[r][c] = b.dataset.color; }); render(); save(); }));

let armed = null;
$('#resetBtn').addEventListener('click', e => {
  if (!armed){ e.target.textContent = 'Bấm lại để xác nhận'; armed = setTimeout(() => { armed = null; e.target.textContent = 'Khôi phục bản gốc'; }, 3000); return; }
  clearTimeout(armed); armed = null; e.target.textContent = 'Khôi phục bản gốc';
  fromOriginal(); save(); render(); setSel(0,0,0,0);
});

// ---------- in ngang ----------
const wrap = $('.wrap');
function fit(){ const w = grid.offsetWidth || 1; grid.style.zoom = Math.min(1, 1040/w); }
function unfit(){ grid.style.zoom = ''; }
window.addEventListener('beforeprint', fit); window.addEventListener('afterprint', unfit);
$('#printBtn').addEventListener('click', () => { commitEdit(); fit(); setTimeout(() => { try { window.print(); } catch(e){} }, 50); });

load(); render(); setSel(0,0,0,0);
</script></body></html>
